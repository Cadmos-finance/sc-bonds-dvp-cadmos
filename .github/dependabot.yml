version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Required even when version-update PRs are disabled.
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
